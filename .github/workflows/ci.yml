name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install media test dependencies
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if [[ "$RUNNER_OS" == "Linux" ]]; then
              sudo apt-get update
              sudo apt-get install -y ffmpeg
            else
              brew install ffmpeg
            fi
          fi
          python3 -m venv "$RUNNER_TEMP/pianissimo-media"
          "$RUNNER_TEMP/pianissimo-media/bin/python" -m pip install 'yt-dlp[default]==2026.8.19'
          echo "PIANISSIMO_YTDLP=$RUNNER_TEMP/pianissimo-media/bin/yt-dlp" >> "$GITHUB_ENV"
      - run: npm run check
      - run: npm run test:media
      - run: python3 -m compileall -q worker
      - run: npm run test:package
  inference:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PIANISSIMO_HOME: ${{ github.workspace }}/.pianissimo
      UV_NO_CACHE: '1'
      PIP_NO_CACHE_DIR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false
      - name: Install FFmpeg
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          else
            brew install ffmpeg
          fi
      - run: npm ci
      - run: npm run build
      - name: Set up the real inference environment and model
        run: node bin/pianissimo.js setup
      - name: Transcribe Swedish speech offline and reuse its cache
        run: npm run test:inference
      - name: Verify setup can be repeated offline
        run: node bin/pianissimo.js setup
        env:
          HF_HUB_OFFLINE: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: inference-logs-${{ matrix.os }}
          path: .pianissimo/logs
